name: XPE CI Pipeline

on:
  push:
    branches: [ main, dev/preprocess, dev/postprocess, dev/gui ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # QA-A-234: coverage-post and coverage-dicom, which are too slow for every push (24 min cold). Mondays 03:00 UTC.
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: xpe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-lane:
    runs-on: windows-2025
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.detect.outputs.lane }}
      is_main: ${{ steps.detect.outputs.is_main }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Lane
        id: detect
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $isMain = "false"
          $lane = "unknown"

          if ($branch -eq "main") {
            $isMain = "true"
            $lane = "main"
          } elseif ($branch -eq "dev/preprocess") {
            $lane = "preprocess"
          } elseif ($branch -eq "dev/postprocess") {
            $lane = "postprocess"
          } elseif ($branch -eq "dev/gui") {
            $lane = "gui"
          }

          Write-Output "lane=$lane" >> $env:GITHUB_OUTPUT
          Write-Output "is_main=$isMain" >> $env:GITHUB_OUTPUT
          Write-Output "Detected: lane=$lane, is_main=$isMain"

  text-lint:
    # Split out of common-build (2026-09-11). A single trailing-whitespace error
    # in common-build failed the job, and because dotnet-tests and gui-e2e-native
    # need it, BOTH were skipped - one whitespace character silently withheld all
    # C# and Native E2E evidence for that commit (run 34535620953 on 83ffa7a).
    # A formatting gate must not be able to hide test evidence, so it stands alone
    # and gates nothing.
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tracked text files
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Test-TrackedTextFiles.ps1

      # #159: Doxygen runs with WARN_AS_ERROR in a separate workflow, and lane
      # sessions have no doxygen installed, so a mismatched @param is found after
      # the merge. This check needs only python and catches the three mismatch
      # classes that have actually broken the build. It runs in text-lint, which
      # gates nothing, for the same reason the whitespace check does.
      - name: Check public header doc comments
        shell: pwsh
        run: python tools/docs/check_header_docs.py

      # A test name is the only traceability link between a requirement and its
      # evidence, and renaming a test breaks neither the build nor the suite -- so
      # a stale citation is silent. #180 hit this twice in one day (a transcription
      # error, and a rename that left the SPEC behind); a lane found both by reading
      # the pushed document against the source. This makes that mechanical.
      - name: Check SPEC test citations
        shell: pwsh
        run: python tools/docs/check_spec_test_refs.py

      # The mirror of the check above: that one guards SPEC -> test, this one
      # guards code -> SPEC. Changing a requirement ID has no step that moves
      # the code citing it, so the break is silent. #197 (a SPEC replaced
      # wholesale, reusing the REQ-P1A- namespace from 001 -- 66 citations left
      # behind) and #195 (the same shape between RTM and SRS) landed days apart.
      # A ratchet, not a hard gate: 73 orphan citations exist today and are
      # recorded in req_citation_baseline.json; the check fails only when a
      # series gains an orphan it did not have. Ten of twelve series are clean
      # and this freezes them there.
      - name: Check code requirement citations
        shell: pwsh
        run: python tools/docs/check_req_citations.py

  common-build:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset ci-common

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci-common --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build/ci-common --build-config RelWithDebInfo --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/ci-common/Testing/

      - name: Upload common binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-common-binaries
          if-no-files-found: warn
          retention-days: 14
          path: build/ci-common/bin/

  preprocess-tests:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CMake (preprocess)
        shell: pwsh
        run: cmake --preset ci-preprocess

      - name: Build preprocess
        shell: pwsh
        run: cmake --build --preset ci-preprocess --parallel

      - name: Run preprocess tests
        shell: pwsh
        run: ctest --test-dir build/ci-preprocess --build-config RelWithDebInfo --output-on-failure

      # #176 (2026-09-17): ctest runs every test in its OWN process (gtest_discover_tests),
      # so global state that leaks from one test into the next can never show there — the
      # next test always starts clean. Three order-dependent tests lived behind that, one of
      # them already red in the DEFAULT order when the binary was run directly (QA-A-88).
      # Running the binary as one process is the only place that leak is visible.
      #
      # Default order plus three fixed shuffle seeds. The seeds are pinned so a failure here is
      # reproducible; a shuffle without a recorded seed is an observation nobody can repeat.
      # Seeds 1 and 9 are the two that exposed the (nah)/(da) leaks before QA-A-89; seed 2 exposed the
      # load/save leak fixed in QA-A-91. A seed only fixes an order for a given test count (580 at QA-A-91):
      # adding tests reshuffles every seed, so these pin regressions, not specific orders.
      #
      # The summary line is checked, not just the exit code: a run that never starts (missing
      # DLL, bad path) exits non-zero with no summary, and a script that reads only its own
      # failure list sees an empty list as a pass (observed in QA-A-89).
      #
      # The ran-count is checked too: a binary that runs zero tests still prints a summary
      # ('[  PASSED  ] 0 tests.') and exits 0 (QA-A-90 hit this with a filter on a file that was
      # not in the build). Every run must execute the same non-zero number of tests.
      - name: Run preprocess test binary as one process (#176)
        shell: pwsh
        run: |
          $exe = Get-ChildItem build/ci-preprocess -Recurse -Filter xpe_preprocess_tests.exe | Select-Object -First 1
          if (-not $exe) { Write-Error 'xpe_preprocess_tests.exe not found - cannot run the single-process check'; exit 1 }
          $env:PATH = "$($exe.DirectoryName);$env:PATH"
          $runs = @(
            @{ name = 'default order'; args = @() },
            @{ name = 'shuffle seed 1'; args = @('--gtest_shuffle', '--gtest_random_seed=1') },
            @{ name = 'shuffle seed 2'; args = @('--gtest_shuffle', '--gtest_random_seed=2') },
            @{ name = 'shuffle seed 9'; args = @('--gtest_shuffle', '--gtest_random_seed=9') }
          )
          $bad = 0
          $ranCounts = @()
          foreach ($r in $runs) {
            $out = & $exe.FullName @($r.args) 2>&1 | Out-String
            $code = $LASTEXITCODE
            $summary = ($out -split "`n" | Where-Object { $_ -match '^\[\s*(PASSED|FAILED)\s*\]' }) -join ' | '
            $ranLine = $out -split "`n" | Where-Object { $_ -match '^\[=+\]\s+(\d+) tests? from .* ran' } | Select-Object -First 1
            $ran = if ($ranLine -and $ranLine -match '^\[=+\]\s+(\d+) tests?') { [int]$Matches[1] } else { -1 }
            Write-Host ("{0}: exit={1} ran={2} summary={3}" -f $r.name, $code, $ran, $summary)
            # A passing gtest prints nothing to the job log, so the perf-gate
            # ratio and the global-state hygiene report were only readable from
            # the LastTest.log artifact (QA-A-115). Echo those lines here so the
            # per-machine ratio distribution can be read from the job log.
            ($out -split "`n" | Where-Object { $_ -match '^\[perf-gate|^\[hygiene\]' }) | ForEach-Object { Write-Host "  $_" }
            if (-not $summary) { Write-Error ("{0}: no gtest summary line - the run did not complete" -f $r.name); $bad++ ; continue }
            if ($ran -le 0) { Write-Error ("{0}: ran {1} tests - a run that executes nothing is not a pass" -f $r.name, $ran); $bad++ ; continue }
            $ranCounts += $ran
            if ($code -ne 0) {
              ($out -split "`n" | Where-Object { $_ -match '^\[\s*FAILED\s*\]' }) | ForEach-Object { Write-Host "  $_" }
              # The names alone did not say WHY (QA-B-183: the first sighting printed only the summary and the
              # cause had to be reproduced locally). Print each failed test's own output, [ RUN ] .. [ FAILED ],
              # capped so one runaway test cannot flood the log.
              $lines = $out -split "`n"
              $block = $null
              foreach ($l in $lines) {
                if ($l -match '^\[\s*RUN\s*\]') { $block = New-Object System.Collections.Generic.List[string] }
                if ($null -ne $block) { $block.Add($l) }
                if ($null -ne $block -and $l -match '^\[\s*FAILED\s*\]\s+\S+\s+\(') {
                  Write-Host "  ---- failed test output ----"
                  $block | Select-Object -First 60 | ForEach-Object { Write-Host "  | $_" }
                  if ($block.Count -gt 60) { Write-Host ("  | ... {0} more line(s) cut" -f ($block.Count - 60)) }
                  $block = $null
                }
                if ($null -ne $block -and $l -match '^\[\s*OK\s*\]') { $block = $null }
              }
              $bad++
            }
          }
          if (($ranCounts | Select-Object -Unique).Count -gt 1) { Write-Error ("runs executed different test counts: {0}" -f ($ranCounts -join ', ')); $bad++ }
          if ($bad -gt 0) { Write-Error ("{0} single-process run(s) failed - state leaks between tests that ctest's per-test processes hide (#176)" -f $bad); exit 1 }

      - name: Upload preprocess test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-preprocess-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/ci-preprocess/Testing/

      - name: Upload preprocess binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-preprocess-binaries
          if-no-files-found: warn
          retention-days: 14
          path: build/ci-preprocess/bin/

  # Post-processing lane build (ci-post preset: common + gsvg/enhance_basic/
  # enhance_advanced/display; dicom/ai off). Until 2026-09-10 no push-triggered
  # job built these DLLs at all, so Lane B code had no CI gate and
  # xpe_enhance_basic.dll was never staged for the C# suite (GUI-C-10, #123).
  asan-tests:
    # QA-A-234 (#253): the common and preprocess tests under MSVC AddressSanitizer. Any AddressSanitizer report
    # aborts the test process, so a report fails this job. It is a gate from the first run: the local run of
    # 2026-10-03 had 0 reports.
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Check the AddressSanitizer runtime is reachable
        shell: pwsh
        run: |
          # The sanitized test executables load clang_rt.asan_dynamic-x86_64.dll from the MSVC bin directory that
          # the developer shell puts on PATH. If the image has no such file, say so here instead of failing later
          # with a loader error.
          $dll = Get-Command clang_rt.asan_dynamic-x86_64.dll -ErrorAction SilentlyContinue
          if (-not $dll) { Write-Error 'clang_rt.asan_dynamic-x86_64.dll is not on PATH: this runner image has no MSVC AddressSanitizer runtime'; exit 1 }
          Write-Host ("ASan runtime: {0}" -f $dll.Source)

      - name: Configure CMake (ASan)
        shell: pwsh
        run: cmake --preset ci-asan

      - name: Build (ASan)
        shell: pwsh
        run: cmake --build --preset ci-asan --parallel

      - name: Run tests under AddressSanitizer
        shell: pwsh
        run: |
          # Three tests are EXCLUDED, each for a stated reason (QA-A-234 M1, measured locally 2026-10-03: they fail
          # under AddressSanitizer with no AddressSanitizer report -- the instrumentation changes what they measure):
          #   EnduranceTest.LoadCycles_ControlLeakIsCaught
          #   XpePreprocessEndurance.ControlLeakIsCaught
          #       controls that prove a leak detector works by measuring heap growth; the sanitizer's allocator
          #       changes the heap numbers, so the control does not fire
          #   RuntimeDetectionPerformanceGateTest.Frame3072SquaredWithinMachineRatio
          #       a timing gate (54,969 ms under ASan); a time budget means nothing under instrumentation
          # Every other test runs. The names are one regular expression for ctest -E.
          $exclude = 'ControlLeakIsCaught|Frame3072SquaredWithinMachineRatio'
          ctest --test-dir build/ci-asan --build-config RelWithDebInfo --output-on-failure -E $exclude
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload ASan test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: asan-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/ci-asan/Testing/

  post-build:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset ci-post

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci-post --parallel

      # Wall-clock budget cases are excluded here for the same reason as in
      # cmake/XpeCoverage.cmake (XPE_COVERAGE_EXCLUDE_TESTS): on a shared runner
      # they measure the machine, not the code. First run (34417874089) failed
      # exactly 3 such cases by 1-16 ms. Timing regressions are the benchmark
      # workflow's gate. Keep this regex in sync with XpeCoverage.cmake.
      - name: Run tests (timing-budget cases excluded)
        shell: pwsh
        run: ctest --test-dir build/ci-post --build-config RelWithDebInfo --output-on-failure -E "Performance|Within[0-9]+ms|PerformanceBudget|LargeImagePerformance"

      # QA-B-140 (#162, 2026-09-19): the same blind spot #176 closed for the preprocess
      # lane was still open here. ctest starts a FRESH PROCESS per test
      # (gtest_discover_tests), so any defect that depends on state carried between tests
      # in one process — a call_once, a static cache, a suppression memo — is invisible to
      # it by construction. Measured: ctest 675/675 green while one test was red when its
      # binary ran as one process.
      #
      # That one red was not a test-only fault. Behind it, multiscale_process wrapped the
      # inert-key helper's call in `if (levels <= 3)`, so the helper's recovery contract
      # (a clean config clears the memo) could never run on that path — warn at 3 levels,
      # fix to 4, go back to 3, and the advice is gone for the life of the process.
      #
      # This ADDS to ctest, it does not replace it: the per-test process isolation ctest
      # gives is still worth having. Cost is one extra suite run (~2m20s locally).
      #
      # Two guards carried over from the preprocess step, each of which caught a real
      # false pass there: a run that never starts exits non-zero with NO summary line
      # (QA-A-89 read the empty failure list as a pass), and a binary that runs zero tests
      # still prints '[  PASSED  ] 0 tests.' and exits 0 (QA-A-90).
      #
      # cwd is modules/gsvg because gsvg_tests reads its phantoms by relative path; the
      # other binaries were measured to be cwd-independent under that setting (QA-B-140).
      #
      # #205 (2026-09-27): the binary list comes from CTEST, not from a glob. It used to be
      # `Get-ChildItem -Filter *.exe` over build/ci-post/bin, which assumes every executable
      # in that directory is a gtest binary. Turning on BUILD_AI put `xpe_ai_worker.exe`
      # there — an IPC worker, not a test — and this step ran it and reported
      # "no gtest summary line - the run did not complete". The glob could not tell a test
      # from a program that merely sits next to one. ctest's own registry can: each
      # registered test names the binary it runs, so a non-test executable is absent by
      # construction and a renamed test binary cannot silently drop out of the list.
      # (This also retires the earlier double-listing hazard the one-glob rule worked
      # around — `Sort-Object -Unique` on the path is what dedupes now.)
      # `working-directory: modules/gsvg` was removed 2026-09-30 (#229). It was
      # holding up 13 cwd-dependent test paths in gsvg -- not by design, by
      # accident: the step skips the ctest layer on purpose (to see order
      # dependence), and skipping ctest also removes the WORKING_DIRECTORY it
      # would have set. gsvg happened to be the one directory where those
      # relative paths resolved; modules/ai's did not, which is how #130 found
      # the class. QA-B-162 and QA-B-163 pinned every path with a compile-time
      # macro guarded by #error, so no binary here reads a relative path now.
      # Checked before removing: enhance_basic, enhance_advanced and display
      # have zero relative data paths in their tests, so the line held up gsvg
      # alone.
      - name: Run post test binaries as one process each (#162)
        shell: pwsh
        run: |
          $binDir = Join-Path $env:GITHUB_WORKSPACE 'build/ci-post/bin'
          $reg = ctest --test-dir "$env:GITHUB_WORKSPACE/build/ci-post" --build-config RelWithDebInfo --show-only=json-v1 | Out-String | ConvertFrom-Json
          $paths = @($reg.tests | ForEach-Object { $_.command[0] } | Sort-Object -Unique)
          $exes = @($paths | Where-Object { Test-Path $_ } | ForEach-Object { Get-Item $_ })
          if ($exes.Count -eq 0) { Write-Error "ctest registered no test binaries under $binDir - cannot run the single-process check"; exit 1 }
          if ($exes.Count -ne $paths.Count) { Write-Error ("ctest names {0} test binaries but only {1} exist on disk - the build and the registry disagree" -f $paths.Count, $exes.Count); exit 1 }
          Write-Host ("single-process check will run {0} test binary(ies) named by ctest" -f $exes.Count)
          # Same exclusion as the ctest step above, for the same reason: these measure the
          # machine, not the code, and timing regressions are the benchmark workflow's gate.
          # Keep in sync with the ctest -E regex and XpeCoverage.cmake. Omitting it made this
          # step's first run red on EdgeEnhance.Performance_3072x3072_Within20ms (28 ms on the
          # runner, under budget on a developer machine) — a gate calibrated elsewhere.
          # `*Performance*` already covers PerformanceBudget and LargeImagePerformance.
          $filter = '--gtest_filter=-*Performance*:*Within*ms*'
          $bad = 0
          foreach ($exe in $exes) {
            $out = & $exe.FullName $filter 2>&1 | Out-String
            $code = $LASTEXITCODE
            $summary = ($out -split "`n" | Where-Object { $_ -match '^\[\s*(PASSED|FAILED)\s*\]' }) -join ' | '
            $ranLine = $out -split "`n" | Where-Object { $_ -match '^\[=+\]\s+(\d+) tests? from .* ran' } | Select-Object -First 1
            $ran = if ($ranLine -and $ranLine -match '^\[=+\]\s+(\d+) tests?') { [int]$Matches[1] } else { -1 }
            Write-Host ("{0}: exit={1} ran={2} summary={3}" -f $exe.Name, $code, $ran, $summary)
            if (-not $summary) { Write-Error ("{0}: no gtest summary line - the run did not complete" -f $exe.Name); $bad++; continue }
            if ($ran -le 0) { Write-Error ("{0}: ran {1} tests - a run that executes nothing is not a pass" -f $exe.Name, $ran); $bad++; continue }
            if ($code -ne 0) {
              ($out -split "`n" | Where-Object { $_ -match '^\[\s*FAILED\s*\]' }) | ForEach-Object { Write-Host "  $_" }
              # The names alone did not say WHY (QA-B-183: the first sighting printed only the summary and the
              # cause had to be reproduced locally). Print each failed test's own output, [ RUN ] .. [ FAILED ],
              # capped so one runaway test cannot flood the log.
              $lines = $out -split "`n"
              $block = $null
              foreach ($l in $lines) {
                if ($l -match '^\[\s*RUN\s*\]') { $block = New-Object System.Collections.Generic.List[string] }
                if ($null -ne $block) { $block.Add($l) }
                if ($null -ne $block -and $l -match '^\[\s*FAILED\s*\]\s+\S+\s+\(') {
                  Write-Host "  ---- failed test output ----"
                  $block | Select-Object -First 60 | ForEach-Object { Write-Host "  | $_" }
                  if ($block.Count -gt 60) { Write-Host ("  | ... {0} more line(s) cut" -f ($block.Count - 60)) }
                  $block = $null
                }
                if ($null -ne $block -and $l -match '^\[\s*OK\s*\]') { $block = $null }
              }
              $bad++
            }
          }
          Write-Host ("in-process: {0} of {1} binary(ies) failed" -f $bad, $exes.Count)
          if ($bad -gt 0) { Write-Error ("{0} single-process run(s) failed - state carried between tests that ctest's per-test processes hide (#162)" -f $bad); exit 1 }

      - name: Upload post test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-post-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/ci-post/Testing/

      - name: Upload post binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-post-binaries
          if-no-files-found: warn
          retention-days: 14
          path: build/ci-post/bin/

  # DICOM module gate (#235, 2026-10-02).
  #
  # Until this job, NO push-triggered job built modules/dicom: ci-post sets
  # BUILD_DICOM=OFF and the only dicom preset (coverage-dicom) runs on
  # workflow_dispatch alone. Every dicom change merged through #235
  # (QA-B-182..185b) was gated by lane-local runs only — the "ci-dicom 243/0"
  # cited in lane reports was a hand-configured local build directory, not a
  # CI job. Found while judging GUI-C-196 M3, whose DICOM write test skips in
  # dotnet-tests for the same reason (no xpe_dicom.dll is staged there).
  #
  # This job builds and runs the dicom tests on every main/lane push. It shares
  # coverage-dicom's vcpkg binary cache (same manifest, same key), so DCMTK is
  # built once and restored after. The binaries are uploaded for a later
  # dotnet-tests handoff; that handoff is not wired yet because the DLL pairing
  # (dicom's vcpkg fmt/spdlog vs common's) failed when overwritten locally
  # (GUI-C-196 m3_report, 0x8007007F) and needs its own measurement.
  dicom-build:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Point VCPKG_ROOT at the runner vcpkg
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path $root)) { $root = 'C:\vcpkg' }
          if (-not (Test-Path (Join-Path $root 'scripts\buildsystems\vcpkg.cmake'))) {
            Write-Error "vcpkg toolchain not found under $root"; exit 1
          }
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-bincache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "VCPKG_DISABLE_METRICS=1" >> $env:GITHUB_ENV
          & (Join-Path $root 'vcpkg.exe') --version

      # Same key as coverage-dicom on purpose: one DCMTK build serves both.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-bincache-${{ runner.os }}-dicom-${{ hashFiles('third_party/dicom/vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-dicom-

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset ci-dicom

      # Saved right after configure (the vcpkg install happens there), so a
      # later test failure does not throw the DCMTK build away.
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-bincache-${{ runner.os }}-dicom-${{ hashFiles('third_party/dicom/vcpkg.json') }}

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci-dicom --parallel

      - name: Put vcpkg runtime DLLs on PATH
        shell: pwsh
        run: |
          $bin = Join-Path (Get-Location) 'build\ci-dicom\vcpkg_installed\x64-windows\bin'
          "$bin;$env:PATH" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The count is printed so a reader can compare it with the lane reports'
      # figure; a ctest run that registers zero tests is a failure, not a pass.
      - name: Run dicom tests (timing-budget cases excluded)
        shell: pwsh
        run: |
          $reg = ctest --test-dir build/ci-dicom --build-config RelWithDebInfo --show-only=json-v1 | Out-String | ConvertFrom-Json
          $n = @($reg.tests).Count
          Write-Host ("ctest registers {0} dicom test(s)" -f $n)
          if ($n -eq 0) { Write-Error "ctest registered no tests under build/ci-dicom"; exit 1 }
          ctest --test-dir build/ci-dicom --build-config RelWithDebInfo --output-on-failure -E "Performance|Within[0-9]+ms|PerformanceBudget|LargeImagePerformance"
          exit $LASTEXITCODE

      - name: Upload dicom test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-dicom-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/ci-dicom/Testing/

      - name: Upload dicom binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-dicom-binaries
          if-no-files-found: warn
          retention-days: 14
          # vcpkg_installed/.../bin carries the DCMTK/OpenJPEG runtime xpe_dicom.dll
          # loads; bin/ alone would upload a DLL that cannot load (GUI-C-196 M3b).
          path: |
            build/ci-dicom/bin/
            build/ci-dicom/vcpkg_installed/x64-windows/bin/

  # ONNX Runtime inference gate (#130, QA-B-160).
  #
  # WHY THIS IS ITS OWN JOB AND NOT A FLAG ON post-build.
  # ci-post leaves XPE_AI_USE_ONNXRUNTIME off, so modules/ai builds as a stub
  # and QA-B-160's five inference assertions call GTEST_SKIP. ctest counts a
  # skip as a pass, which is exactly the shape of #205: a suite cited as green
  # that never ran the thing it is named for. Turning ci-post itself into a
  # full build would make an 82 MB download a precondition for every Lane B
  # test, so a failed fetch would redden work that has nothing to do with AI.
  # A separate job keeps that blast radius here.
  #
  # XPE_AI_EXPECT_ONNX=1 is the guard QA-B-160 added: with it set, a stub build
  # FAILS instead of skipping. Measured both ways before landing --
  # stub+expect = red, full+expect = green, stub+no-expect = green (control).
  # Without that variable this job could pass while linking nothing.
  ai-onnx:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 30

    env:
      ORT_VERSION: 1.30.0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./tools/ci/Use-MsvcDevShell.ps1 -PersistForGitHubActions

      # Keyed on the version so a bump re-downloads and a re-run does not.
      # Measured payload: 82,645,522 B (QA-B-160).
      - name: Cache ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/_deps/onnxruntime-win-x64-${{ env.ORT_VERSION }}
          key: ort-win-x64-${{ env.ORT_VERSION }}

      - name: Fetch ONNX Runtime
        if: steps.ort-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $v = $env:ORT_VERSION
          $url = "https://github.com/microsoft/onnxruntime/releases/download/v$v/onnxruntime-win-x64-$v.zip"
          $zip = Join-Path $env:RUNNER_TEMP "ort.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $deps = Join-Path $env:GITHUB_WORKSPACE "_deps"
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          Expand-Archive -Path $zip -DestinationPath $deps -Force
          Get-ChildItem $deps

      - name: Configure CMake
        shell: pwsh
        run: |
          $ort = Join-Path $env:GITHUB_WORKSPACE "_deps/onnxruntime-win-x64-$env:ORT_VERSION"
          if (-not (Test-Path (Join-Path $ort 'lib/onnxruntime.lib'))) {
            throw "onnxruntime.lib not found under $ort -- layout changed, see QA-B-160"
          }
          cmake --preset ci-ai "-DONNXRUNTIME_ROOT=$ort"

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci-ai --parallel

      # XPE_AI_EXPECT_ONNX=1 turns "skipped because this is a stub" into a
      # failure. A green here therefore means the inference path ran.
      - name: Run AI tests (a stub build fails here, it does not skip)
        shell: pwsh
        env:
          XPE_AI_EXPECT_ONNX: '1'
        run: ctest --test-dir build/ci-ai --build-config RelWithDebInfo --output-on-failure

  dotnet-tests:
    needs: [detect-lane, common-build, preprocess-tests, post-build, dicom-build]
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane == 'gui'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Two native axes gate this suite, and neither uses SkipHelper.cs
      # (that helper has zero callers — the guards are inline early returns):
      #   1. IsAvailable  -> xpe_common.dll      (51 of 90 cases)
      #   2. DllPath      -> xpe_preprocess.dll  (9 of 90 cases, P1AReady/)
      # Both probe build/ci-common/bin, so staging the two DLLs there covers
      # the csproj CopyXpeDllsForTests target and TryFindDll at once. Without
      # them the suite reports 90/90 pass with 0 skipped while verifying nothing.
      - name: Download common binaries
        uses: actions/download-artifact@v6
        with:
          name: xpe-ci-common-binaries
          path: build/ci-common/bin/

      - name: Download preprocess binaries
        uses: actions/download-artifact@v6
        with:
          name: xpe-ci-preprocess-binaries
          path: build/ci-common/bin/

      # enhance_basic is exercised by DataSizeContractTests (GUI-C-10, #123);
      # without this download those cases skip silently.
      - name: Download post binaries
        uses: actions/download-artifact@v6
        with:
          name: xpe-ci-post-binaries
          path: build/ci-common/bin/

      # GUI-C-196 M3b. The real-module DICOM tests need xpe_dicom.dll AND the
      # DCMTK/OpenJPEG runtime next to it. The merge rule is "never replace a
      # name that is already there": the common/preprocess/post set was built
      # together and wins. Measured locally with a stand-in vcpkg tree: the
      # no-replace rule loads and passes; replacing common's fmt/spdlog/gtest
      # with the vcpkg-tree copies fails to load xpe_dicom.dll with 0x8007007F
      # (m3b/step2_copy_rules.txt). The CI vcpkg tree's own contents were NOT
      # measured; the rule does not depend on them.
      - name: Download dicom binaries
        uses: actions/download-artifact@v6
        with:
          name: xpe-ci-dicom-binaries
          path: build/ci-dicom/

      - name: Merge dicom DLLs into the common set (never replace)
        shell: pwsh
        run: |
          $dest = 'build/ci-common/bin'
          $added = @(); $kept = @()
          Get-ChildItem build/ci-dicom -Recurse -Filter *.dll | Sort-Object FullName | ForEach-Object {
            $target = Join-Path $dest $_.Name
            if (Test-Path $target) { $kept += $_.Name } else { Copy-Item $_.FullName $target; $added += $_.Name }
          }
          Write-Host ("added {0} dll(s): {1}" -f $added.Count, ($added -join ', '))
          Write-Host ("kept the common set's copy of {0} dll(s): {1}" -f $kept.Count, ($kept -join ', '))

      - name: Verify native binaries present
        shell: pwsh
        run: |
          $missing = @()
          foreach ($n in @('xpe_common.dll', 'xpe_preprocess.dll', 'xpe_enhance_basic.dll', 'xpe_display.dll', 'xpe_dicom.dll', 'dcmdata.dll', 'openjp2.dll')) {
            if (-not (Test-Path "build/ci-common/bin/$n")) { $missing += $n }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Native DLLs missing from build/ci-common/bin: $($missing -join ', ') - the suite would report 90/90 pass with 0 skipped while verifying nothing"
            exit 1
          }
          Get-ChildItem build/ci-common/bin/ -Filter *.dll | Select-Object Name, Length

      - name: Run C# integration tests
        shell: pwsh
        run: >
          dotnet test clients/ImageProcTest.IntegrationTests/ImageProcTest.IntegrationTests.csproj
          -c Debug
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory build/dotnet-test-results

      # GUI-C-209 M3 (#249, AC-12). SPEC-XPE-GUI-IT section 7 bounds three things in time: Category=Smoke < 30 s, the full run < 2 min,
      # a single test < 5 s (and the 1000-cycle leak test, Category=Safety, < 90 s). Nothing measured any of them: the step above runs the whole
      # suite with no filter, so Smoke was never selected on its own and no duration was ever compared with a limit. The SPEC recommends x1.5
      # headroom on CI, applied here. A run that selects fewer tests than expected is a failure, not a fast pass (a filter that matches
      # nothing finishes instantly). Measured locally on the reference box: full 11.6 s, Smoke 19 tests 2 s, slowest test 2.7 s.
      - name: Assert the SPEC time gates (AC-12)
        shell: pwsh
        # Enforced from 2026-10-03 after reading the first runner output (483e8fd2, run 37095895181 dotnet-tests):
        # full run 14.2 s of 180, slowest test 2.68 s of 7.5, Smoke 19 tests 1.3 s of 45, Safety 10 tests 1.3 s of 135.
        env:
          AC12_ENFORCE: '1'
        run: |
          $ErrorActionPreference = 'Stop'
          $proj = 'clients/ImageProcTest.IntegrationTests/ImageProcTest.IntegrationTests.csproj'
          $trxPath = if ($env:AC12_TRX) { $env:AC12_TRX } else { 'build/dotnet-test-results/integration-tests.trx' }
          # SPEC-XPE-GUI-IT section 7 limits x1.5 (the SPEC recommends x1.5 headroom on CI).
          function Limit($name, $spec) { $v = [Environment]::GetEnvironmentVariable($name); if ($v) { [double]$v } else { $spec * 1.5 } }
          $smokeLimit  = Limit 'AC12_SMOKE_LIMIT_S'  30
          $fullLimit   = Limit 'AC12_FULL_LIMIT_S'   120
          $testLimit   = Limit 'AC12_TEST_LIMIT_S'   5
          $safetyLimit = Limit 'AC12_SAFETY_LIMIT_S' 90
          $minSmoke    = if ($env:AC12_MIN_SMOKE) { [int]$env:AC12_MIN_SMOKE } else { 10 }
          # GUI-C-216: a run that selected only one of the ten Safety tests used to pass this gate (minimum was 1).
          $minSafety   = if ($env:AC12_MIN_SAFETY) { [int]$env:AC12_MIN_SAFETY } else { 10 }
          $bad = @()

          # Full Functional: the whole run just made by the previous step (trx start..finish), and the slowest single test.
          [xml]$doc = Get-Content -LiteralPath $trxPath -Raw
          $times = $doc.TestRun.Times
          $full = ([datetime]$times.finish - [datetime]$times.start).TotalSeconds
          $results = @($doc.TestRun.Results.UnitTestResult)
          $slow = $results | ForEach-Object { [pscustomobject]@{ Name = $_.testName; Seconds = [timespan]::Parse($_.duration).TotalSeconds } } | Sort-Object Seconds -Descending | Select-Object -First 1
          Write-Host ("full run: {0:N1} s over {1} result(s) (limit {2:N0} s); slowest test {3:N2} s: {4}" -f $full, $results.Count, $fullLimit, $slow.Seconds, $slow.Name)
          if ($results.Count -eq 0) { $bad += 'the trx holds no results' }
          if ($full -gt $fullLimit) { $bad += ("full run {0:N1} s > {1:N0} s" -f $full, $fullLimit) }
          if ($slow.Seconds -gt $testLimit) { $bad += ("slowest test {0:N2} s > {1:N1} s: {2}" -f $slow.Seconds, $testLimit, $slow.Name) }

          # Smoke and Safety are the categories the SPEC bounds; the trx carries no categories, so each is run on its own, wall-clock
          # from process start (what the SPEC says it measures), and a run that selected too few tests is a failure, not a fast pass.
          foreach ($c in @(@{ Cat = 'Smoke'; Limit = $smokeLimit; Min = $minSmoke }, @{ Cat = 'Safety'; Limit = $safetyLimit; Min = $minSafety })) {
            $sw = [System.Diagnostics.Stopwatch]::StartNew()
            $ErrorActionPreference = 'Continue'   # a native command's stderr must not become a terminating error
            $out = dotnet test $proj -c Debug --no-build --filter "Category=$($c.Cat)" 2>&1 | Out-String
            $sw.Stop()
            $ErrorActionPreference = 'Stop'
            # The summary line is 'Passed!  - Failed: 0, Passed: N, Skipped: 0, Total: N, ...' in every locale but with translated words; the four counts are positional (failed, passed, skipped, total).
            $m = [regex]::Match($out, '(?m)^\S+!\s+-\s+\S+:\s+(\d+),\s+\S+:\s+(\d+),\s+\S+:\s+(\d+),\s+\S+:\s+(\d+)')
            if (-not $m.Success) { $bad += ("Category={0}: no test summary line:`n{1}" -f $c.Cat, $out); continue }
            if ([int]$m.Groups[1].Value -ne 0 -or [int]$m.Groups[3].Value -ne 0) { $bad += ("Category={0}: {1} failed, {2} skipped" -f $c.Cat, $m.Groups[1].Value, $m.Groups[3].Value) }
            $total = [int]$m.Groups[4].Value
            Write-Host ("Category={0}: {1} test(s), {2:N1} s wall-clock (limit {3:N0} s, at least {4} test(s))" -f $c.Cat, $total, $sw.Elapsed.TotalSeconds, $c.Limit, $c.Min)
            if ($total -lt $c.Min) { $bad += ("Category={0} selected {1} test(s), expected at least {2}" -f $c.Cat, $total, $c.Min) }
            if ($sw.Elapsed.TotalSeconds -gt $c.Limit) { $bad += ("Category={0} {1:N1} s > {2:N0} s" -f $c.Cat, $sw.Elapsed.TotalSeconds, $c.Limit) }
          }

          # Measure-first (lead, 2026-10-03): the limits above were derived on a local box; the runner's times are not yet known.
          # Until the first CI runs have been read and the limits confirmed, an exceeded limit is reported as a warning.
          # Set AC12_ENFORCE=1 (job env) to make it fail the job.
          if ($bad.Count -gt 0) {
            $msg = "AC-12 time gates exceeded:`n" + ($bad -join "`n")
            if ($env:AC12_ENFORCE -eq '1') { Write-Error $msg; exit 1 } else { Write-Host "::warning::$($msg -replace "`n", ' | ')" }
          }

      # GUI-C-196 M3b. These tests are [SkippableFact]: without their DLLs they
      # end NotExecuted and the run is still green. Here a skip is a failure,
      # and so is finding fewer results than expected (zero rows would otherwise
      # pass a "none failed" check).
      - name: Assert the real-module tests ran (a skip fails)
        shell: pwsh
        run: |
          [xml]$doc = Get-Content -LiteralPath build/dotnet-test-results/integration-tests.trx -Raw
          $all = @($doc.TestRun.Results.UnitTestResult)
          Write-Host ("trx holds {0} result(s)" -f $all.Count)
          $min = @{ 'BaselineDicomNativeTests' = 2; 'EnhanceBasicNativeTests' = 4; 'BaselineDisplayNativeTests' = 2 }
          $bad = @()
          foreach ($class in $min.Keys) {
            $rows = @($all | Where-Object { $_.testName -like "*.$class.*" })
            $passed = @($rows | Where-Object { $_.outcome -eq 'Passed' })
            Write-Host ("{0}: {1} result(s), {2} passed, {3} not executed" -f $class, $rows.Count, $passed.Count, @($rows | Where-Object { $_.outcome -eq 'NotExecuted' }).Count)
            if ($rows.Count -lt $min[$class] -or $passed.Count -ne $rows.Count) { $bad += $class }
          }
          if ($bad.Count -gt 0) { Write-Error ("real-module tests skipped or missing: " + ($bad -join ', ')); exit 1 }

      - name: Upload C# test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-dotnet-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/dotnet-test-results/

  # GUI shell contract runners (#227).
  #
  # WHY THIS JOB EXISTS. `gui/ImageProcTest.E2E` and `gui/ImageProcTest.SelfCheck`
  # are built by the solution but were executed by NO workflow. #228 is what that
  # costs: the E2E runner asserted a constant window title, HAZ-GUI-005 (#175)
  # made the title dynamic so an operator cannot miss a mock backend, and the
  # runner sat broken for TWELVE DAYS because nothing ran it. Two more of its
  # assertions had gone stale the same way (menu items #225 enabled, a panel
  # toggle #165 removed) and were only found once the first one was fixed.
  #
  # WHY IT IS NOT REDUNDANT. Measured before adding: these runners assert the
  # XAML shell contract -- six canonical top-level menu groups, command bindings
  # present, specific items still disabled -- and no suite that CI runs asserts
  # any of it. `gui-automation` produces DisabledFutureCommandCount but nothing
  # asserts it; the clients E2E suite drives the app through UIA and checks
  # behaviour, not shell structure.
  #
  # Both runners resolve paths by walking up to the repository root, so they run
  # only where a checkout exists -- which is true here and is exactly why they
  # are a CI job rather than a shipped operator feature.
  gui-shell-runners:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build operator app and runners
        shell: pwsh
        run: |
          dotnet build gui/ImageProcTest/ImageProcTest.csproj -c Debug
          dotnet build gui/ImageProcTest.SelfCheck/ImageProcTest.SelfCheck.csproj -c Debug
          dotnet build gui/ImageProcTest.E2E/ImageProcTest.E2E.csproj -c Debug

      # SelfCheck first: the E2E runner shells out to it, so a SelfCheck failure
      # would otherwise surface as an E2E failure with the wrong cause attached.
      - name: Run SelfCheck
        shell: pwsh
        run: dotnet run --project gui/ImageProcTest.SelfCheck/ImageProcTest.SelfCheck.csproj -c Debug --no-build

      # Creates its own MainWindow in-process (Program.cs:16-74) rather than
      # searching the desktop, so it needs no interactive session and cannot
      # attach to a stray window.
      - name: Run GUI shell E2E
        shell: pwsh
        run: dotnet run --project gui/ImageProcTest.E2E/ImageProcTest.E2E.csproj -c Debug --no-build

  gui-shipped-build:
    # GUI-C-192e/192f (GUI-C-193): the shipped (Release) operator app must not contain the test fault switches. Every other job builds Debug, so
    # nothing else would notice a Release build that carries them. The script builds Debug as a positive control (the scan must FIND the strings
    # there), builds Release and scans its dll/pdb/xml, checks that -p:XpeTestFaults=true is refused for Release with error XPE0001, and runs the
    # Release exe with each switch expecting exit code 2.
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Check the shipped build
        shell: pwsh
        run: ./tools/ci/Test-ShippedBuild.ps1

  gui-automation:
    # WPF automation run of the operator app (gui/ImageProcTest) on a hosted
    # runner. GUI-C-25 (#136) showed a hidden-window non-interactive run works
    # locally (exit 0, ~6 s, Passed=true) but could not prove it survives a
    # session-0 style CI desktop - this job IS that experiment. Mock backend,
    # so no native DLLs are needed; the Native variant follows GUI-C-26
    # (--automation-backend). A failure here is one red job, not a gate on
    # the native lanes.
    # 15 -> 30 (2026-10-03): the Mock suite took 14m39s on dbade001 and was cut at 15m on e8db144c with tests
    # still running (xUnit 12:56 elapsed, no hang - the last lines are ordinary skips). The suite grew, the
    # limit did not; a cut is an absence of evidence, not a red.
    needs: [detect-lane]
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build gui app
        shell: pwsh
        run: dotnet build gui/ImageProcTest/ImageProcTest.csproj -c Debug

      - name: Run automation (hidden window, Mock backend)
        shell: pwsh
        working-directory: gui/ImageProcTest
        run: |
          $exe = Resolve-Path 'bin/Debug/net8.0-windows/ImageProcTest.exe'
          $report = Join-Path $PWD 'automation-report.json'
          $p = Start-Process -FilePath $exe -WindowStyle Hidden -Wait -PassThru -ArgumentList @(
            '--automation-raw', 'fixtures/gui-s0/raw/synthetic_1024x1024.raw',
            '--automation-report', $report,
            '--automation-backend', 'Mock',
            '--automation-width', '1024', '--automation-height', '1024')
          Write-Host "exit=$($p.ExitCode)"
          if (-not (Test-Path $report)) { Write-Error 'automation report not written'; exit 1 }
          $r = Get-Content $report -Raw | ConvertFrom-Json
          Write-Host ("BackendMode={0} source={1} BackendVersion={2} Passed={3}" -f $r.BackendMode, $r.BackendModeSource, $r.BackendVersion, $r.Passed)
          if ($r.BackendModeSource -ne 'arg') { Write-Error 'backend did not come from --automation-backend'; exit 1 }
          if ($p.ExitCode -ne 0 -or -not $r.Passed) { Write-Error 'automation Passed=false or non-zero exit'; exit 1 }

      # FlaUI smoke S-01..S-05 (GUI-C-29, XPE-GUI-E2E-001 4.1). The fixture walks up
      # from the test bin dir to gui/ImageProcTest/bin/Debug/net8.0-windows/ImageProcTest.exe
      # (built above) and launches it with --automation-backend Mock. Gate < 30 s; local 584 ms.
      #
      # XPE_E2E_ALLOW_GLOBAL_INPUT (GUI-C-171, 2026-10-01): the 13 scenarios that need real
      # mouse/keyboard input (key gestures, wheel, drag, a click on a disabled button) now
      # SKIP unless this is "1". On a developer machine their input went to whatever window
      # was in front - a Claude Code terminal, where ESC interrupted the session. A hosted
      # runner's desktop has nothing else on it, and these scenarios sent the same input here
      # and passed before C-171, so CI opts in. Without it they would skip silently in this
      # job (no skip gate here) and fail the Native job's unexplained-skip gate.
      - name: Run FlaUI E2E smoke (Mock)
        shell: pwsh
        env:
          XPE_E2E_ALLOW_GLOBAL_INPUT: "1"
        run: >
          dotnet test clients/ImageProcTest.E2ETests/ImageProcTest.E2ETests.csproj
          -c Debug
          --logger "trx;LogFileName=e2e-smoke.trx"
          --results-directory build/e2e-test-results

      # The opt-in above is only worth something if those scenarios actually ran. This job has
      # no general skip gate (by-design Mock backend skips would need their own token first),
      # so this checks the one thing C-171 can make go missing: a scenario skipped because the
      # input gate was closed. Zero is required; the count of all skips is printed so a change
      # in the by-design skips stays visible.
      - name: Assert no input-gated E2E case was skipped (Mock)
        shell: pwsh
        run: |
          $trx = Get-ChildItem build/e2e-test-results -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) { Write-Error 'no trx produced'; exit 1 }
          [xml]$x = Get-Content $trx.FullName
          $results = @($x.TestRun.Results.UnitTestResult)
          $skipped = @($results | Where-Object { $_.outcome -ne 'Passed' -and $_.outcome -ne 'Failed' })
          $gated = @($skipped | Where-Object { ([string]$_.Output.ErrorInfo.Message) -match 'XPE_E2E_ALLOW_GLOBAL_INPUT' })
          Write-Host ("results={0} skipped={1} input-gated-skips={2}" -f $results.Count, $skipped.Count, $gated.Count)
          foreach ($g in $gated) { Write-Host ("INPUT GATE CLOSED: {0}" -f $g.testName) }
          if ($gated.Count -gt 0) {
            Write-Error ('{0} input scenario(s) skipped although CI opted in - the opt-in did not reach the test process' -f $gated.Count)
            exit 1
          }

      - name: Upload E2E smoke results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-gui-e2e-smoke-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/e2e-test-results/

      - name: Upload automation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-gui-automation-report
          if-no-files-found: ignore
          retention-days: 14
          path: gui/ImageProcTest/automation-report.json

  gui-e2e-native:
    # FlaUI smoke against the REAL native DLLs (GUI-C-31/C-32). Since GUI-C-32
    # the gui app resolves native DLLs through the shared NativeSearchPolicy
    # locator, so the artifacts are staged into a SEPARATE directory and handed
    # over with XPE_NATIVE_DIR + XPE_NATIVE_DIR_EXCLUSIVE=1 - the app folder holds
    # no xpe_*.dll, so a pass here proves the locator path, not the OS loader.
    # S-05 demands a real semver and fails if the app silently fell back to Mock.
    needs: [detect-lane, common-build, preprocess-tests, post-build, dicom-build]
    runs-on: windows-2025
    # 20 -> 30 (2026-09-30). Measured on main, same job, three consecutive runs:
    # 18 min, 19 min, then 20:14 -- cancelled exactly at the 20-minute limit
    # during "Run FlaUI E2E smoke (Native)". Ten other jobs were green in that
    # run, so this is the suite outgrowing its budget, not a hang.
    #
    # This is a BUDGET change, not a fix, and it is deliberately not treated as
    # one: raising a limit to clear a red light is how a real slowdown gets
    # hidden. What the 18 -> 20 trend cannot tell apart is content growth
    # (GUI-C-159 added ~5 s per automation run; C-160/161 added scenarios) from
    # runner variance -- this repository has measured the same runner swinging
    # 1.5x in a week. GUI-C-164 is dispatched to measure per-scenario duration
    # so the next budget number is derived rather than guessed.
    #
    # 30 matched the peer jobs (preprocess-tests, ai-onnx, dotnet-tests) and
    # restored roughly 50% headroom over the then-observed 20 min.
    #
    # Raised to 45 (2026-10-03): at 090532a6 the job took 24.7 min (headroom
    # already down to ~18%); at e8e14166 the same 148 scenarios summed 1499 s
    # against 1166 s (+29%) and the job was cancelled at 30 min with every
    # finished scenario passing. The rise is spread across most scenarios (one
    # outlier: A3 filtered-list 34 -> 125 s), which reads as runner variance
    # plus content growth, not a hang. 45 restores ~80% headroom over 24.7 min.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build gui app
        shell: pwsh
        run: dotnet build gui/ImageProcTest/ImageProcTest.csproj -c Debug

      # GUI-C-212 (#249): LegacyPreprocessReadinessScenarios launch the legacy diagnostic app (clients/ImageProcTest) and read its Diagnostics, Calibration and
      # Evaluation tabs through UIA. This job built only the gui app, so those scenarios would SKIP here ("ImageProcTest.exe was not found") and the unexplained-skip
      # gate below would fail the job - which is the intended answer to a staging fault, so the app is built here rather than the skip being allow-listed.
      - name: Build the legacy diagnostic app
        shell: pwsh
        run: dotnet build clients/ImageProcTest/ImageProcTest.csproj -c Debug

      # A04/A05/A06 drive the two console runners THROUGH the app and assert it
      # reports their verdict. This job built only the app, so all three landed
      # as NotExecuted on every run -- and the skip guard then failed the job
      # for an unexplained skip, which is how the gap surfaced at all.
      #
      # The alternative was an allow-list row saying "the runners are absent
      # here". That is the #205 shape: three scenarios permanently accounted
      # for and never run anywhere, because gui-shell-runners exercises the
      # runners standalone and never through the app. Building them is the only
      # option under which the scenarios produce a verdict.
      #
      # Whether building is SUFFICIENT is not established -- the app resolves
      # the runners by path, and if it does not find them here the three skip
      # again, with a reason that says why. GUI-C-165 is asked that question;
      # this run is the measurement.
      - name: Build the console runners the app drives
        shell: pwsh
        run: |
          dotnet build gui/ImageProcTest.SelfCheck/ImageProcTest.SelfCheck.csproj -c Debug
          dotnet build gui/ImageProcTest.E2E/ImageProcTest.E2E.csproj -c Debug

      - name: Stage native DLLs into a locator-only directory
        uses: actions/download-artifact@v6
        with:
          pattern: xpe-ci-{common,preprocess,post}-binaries
          merge-multiple: true
          path: build/e2e-native-dlls/

      # GUI-C-196 M4 (A19 runs the Deterministic Baseline on the real modules and needs xpe_dicom.dll with the DCMTK/OpenJPEG runtime). Without them A19
      # SKIPS, and this job's unexplained-skip gate below fails on it. Same merge rule as dotnet-tests (GUI-C-196 M3b): a name already staged is never replaced.
      - name: Stage dicom DLLs into the same directory (never replace)
        uses: actions/download-artifact@v6
        with:
          name: xpe-ci-dicom-binaries
          path: build/ci-dicom/

      - name: Merge dicom DLLs (never replace)
        shell: pwsh
        run: |
          $dest = 'build/e2e-native-dlls'
          $added = @(); $kept = @()
          Get-ChildItem build/ci-dicom -Recurse -Filter *.dll | Sort-Object FullName | ForEach-Object {
            $target = Join-Path $dest $_.Name
            if (Test-Path $target) { $kept += $_.Name } else { Copy-Item $_.FullName $target; $added += $_.Name }
          }
          Write-Host ("added {0} dll(s): {1}" -f $added.Count, ($added -join ', '))
          Write-Host ("kept the staged copy of {0} dll(s): {1}" -f $kept.Count, ($kept -join ', '))

      - name: Verify staged DLLs and that the app folder holds none
        shell: pwsh
        run: |
          $dir = 'build/e2e-native-dlls'
          # gsvg.dll is named without the xpe_ prefix, so the old name list and
          # the old xpe_*.dll leak filter both missed it (#180, GUI-C-105): a
          # missing gsvg.dll passed this step, and a gsvg.dll sitting in the app
          # folder would load through the OS loader while this job claimed the
          # locator path was proven. Both checks now name it explicitly.
          # xpe_ai.dll and its worker joined with GUI-C-184 (#225 row 10): the AI
          # stage's E2E must reach the module and observe its failure path, not
          # pass on "DLL not found". Both ship in xpe-ci-post-binaries already;
          # listing them makes a missing one fail here instead of in silence.
          foreach ($n in @('xpe_common.dll', 'xpe_preprocess.dll', 'xpe_display.dll', 'gsvg.dll', 'xpe_ai.dll', 'xpe_ai_worker.exe', 'xpe_enhance_basic.dll', 'xpe_dicom.dll', 'dcmdata.dll', 'openjp2.dll')) {
            if (-not (Test-Path "$dir/$n")) { Write-Error "missing $n in $dir"; exit 1 }
          }
          $appDir = 'gui/ImageProcTest/bin/Debug/net8.0-windows'
          $leak = Get-ChildItem $appDir -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'xpe_*.dll' -or $_.Name -eq 'gsvg.dll' }
          if ($leak) { Write-Error "app folder must not contain native module DLLs (would bypass the locator): $($leak.Name -join ', ')"; exit 1 }
          Get-ChildItem $dir | Where-Object { $_.Name -like 'xpe_*.dll' -or $_.Name -eq 'gsvg.dll' } |
            Select-Object Name, Length, LastWriteTime

      # #180: the virtual grid needs its table next to the DLLs. The GUI's
      # default table path is "beside the loaded DLL", and the CI artifacts carry
      # binaries only, so without this copy every virtual-grid E2E fails with
      # "table was not found". The repo file is the product table until an
      # install rule exists (decision pending, #180).
      - name: Stage the virtual-grid table beside the DLLs
        shell: pwsh
        run: |
          $dir = 'build/e2e-native-dlls'
          $src = 'modules/gsvg/data/vg_table_water_csi600_victre.csv'
          if (-not (Test-Path $src)) { Write-Error "missing product table: $src"; exit 1 }
          Copy-Item $src (Join-Path $dir (Split-Path $src -Leaf)) -Force
          Get-ChildItem $dir -Filter *.csv | Select-Object Name, Length

      # GUI-C-41: a Native pass only means something if you know WHICH native
      # binaries ran. Locally the lane stages artifacts from an older CI run
      # (#98 forbids native builds there), so "Native 9/9" can silently be a
      # pass against stale DLLs. The E2E fixture requires this manifest and
      # prints its runId/headSha; here both are the current run by construction.
      - name: Record staged-DLL provenance
        shell: pwsh
        run: |
          $dir = 'build/e2e-native-dlls'
          $files = Get-ChildItem $dir -Filter xpe_*.dll | ForEach-Object {
            [pscustomobject]@{
              name   = $_.Name
              md5    = (Get-FileHash $_.FullName -Algorithm MD5).Hash.ToLower()
              length = $_.Length
            }
          }
          [pscustomobject]@{
            source  = 'ci'
            runId   = '${{ github.run_id }}'
            headSha = '${{ github.sha }}'
            files   = $files
          } | ConvertTo-Json -Depth 4 | Set-Content "$dir/provenance.json" -Encoding utf8
          Get-Content "$dir/provenance.json"

      - name: Run FlaUI E2E smoke (Native)
        shell: pwsh
        env:
          XPE_E2E_BACKEND: Native
          XPE_NATIVE_DIR: ${{ github.workspace }}/build/e2e-native-dlls
          XPE_NATIVE_DIR_EXCLUSIVE: "1"
          # GUI-C-171 opt-in, same reason as the Mock job. The unexplained-skip gate below is
          # deliberately NOT given an allow-list entry for these: an input-gated skip here
          # means the opt-in failed, and that should stay red.
          XPE_E2E_ALLOW_GLOBAL_INPUT: "1"
        run: >
          dotnet test clients/ImageProcTest.E2ETests/ImageProcTest.E2ETests.csproj
          -c Debug
          --logger "trx;LogFileName=e2e-smoke-native.trx"
          --logger "console;verbosity=detailed"
          --results-directory build/e2e-native-results

      # GUI-C-218: a test that failed while launching an app could leave that app running, and an app started with
      # UseShellExecute=false inherits this step's output pipe - dotnet test then waits on the pipe until the job limit.
      # The test-side leak is fixed (LaunchOrSkip is exception-safe); this step is the job-side backstop, and it
      # reports what it had to kill so a leak is visible rather than silently cleaned up.
      - name: Kill leftover app processes (backstop, reports what it found)
        if: always()
        shell: pwsh
        run: |
          $left = @(Get-Process -Name 'ImageProcTest*', 'xpe_ai_worker' -ErrorAction SilentlyContinue)
          if ($left.Count -eq 0) { Write-Host 'no leftover app processes'; exit 0 }
          foreach ($p in $left) { Write-Host ("::warning::leftover process {0} (pid {1}) after the E2E step - a test did not close it" -f $p.ProcessName, $p.Id) }
          $left | Stop-Process -Force -ErrorAction SilentlyContinue

      # GUI-C-37: when the XCal generator is absent the Native W-02 scenario SKIPs rather
      # than failing (so an unmeasured run is not reported as "measured fine"). The
      # generator is part of xpe-ci-preprocess-binaries staged above, so here a skip is
      # never legitimate - treat any skipped E2E case as a failure of this job.
      # Counters.notExecuted is NOT reliable: a run-time xUnit skip lands as a
      # UnitTestResult with outcome="NotExecuted" while Counters.notExecuted stays 0
      # (observed 2026-09-11, run 34538498373: total=13 executed=12 notExecuted=0 with
      # W-02 skipped). Read total-vs-executed AND the per-result outcomes instead, and
      # print each skip reason - a silent skip is exactly what this gate exists to catch.
      # GUI-C-74 (2026-09-16): this gate printed each skip reason but judged on the
      # COUNT alone, so a skip we understand and a skip we do not were the same thing
      # to it. Two decisions had entered independently and had never met here: GUI-C-37
      # added this gate (a staged generator means a W-02 skip is a staging fault), and
      # GUI-C-55 later made ReadableWindow_IsKept_AndLeavesNoNote SKIP when the window
      # re-acquisition defect fires in its own launch, so "not measured" would not be
      # counted as "measured and fine". Measured frequency: 7.0% per launch (100 launches,
      # control UnreadableWindow_ 50/50 green), roughly 25% per CI Native run.
      #
      # Failing the job on that is the "unread red light" state this repo has already
      # lived through - a quarter of Native runs red for a defect nobody is fixing that
      # week trains everyone to ignore the colour, and the gate stops working on the
      # staging fault it exists to catch. So the gate now discriminates, and the defect
      # is COUNTED instead (below).
      #
      # It keys on an explicit machine-readable token, NOT on prose: a skip message must
      # carry `XPE-SKIP-ALLOWED:<issue>` for a listed issue. A reason string is a contract
      # the moment a gate reads it, and prose drifts silently; a token is written on
      # purpose and its absence is loud. Every entry names an issue, and the count of
      # entries is printed each run, so widening the list is visible rather than quiet.
      #
      # Correction 2026-09-17: the first version of this list keyed on `30011`, which reads
      # as an issue number and is not one - it is the UIA PropertyNotSupportedException code
      # (clients/ImageProcTest.E2ETests/Fixtures/ApplicationFixture.cs:151). Anyone who
      # looked it up as an issue found nothing, and the defect itself had no open issue at
      # all until #170 - eleven lane reports had narrowed it while `.moai/reports/` stayed
      # gitignored, so none of that was anywhere a reader could reach. The key is the
      # ISSUE; the UIA code lives in the description, where it cannot be read as an address.
      #
      # NOT done here, on purpose: retrying the launch (it spends wall-clock against a
      # Smoke suite already near its time gate, and it would mask a regression in the
      # defect's own frequency), and extending this gate to the Mock job (Mock has no
      # skip gate at all today - its by-design backend skip would need its own token
      # first; recorded as a separate gap, not fixed in passing).
      - name: Assert no unexplained skipped Native E2E cases
        shell: pwsh
        run: |
          # GUI-C-75 observed the em dash in a skip reason arriving as '?' in the log.
          # The token is ASCII so the verdict is unaffected, but the half a human reads
          # is what gets damaged - and that half is the only thing explaining the skip.
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          # Each entry: issue number -> why this skip is understood. Adding a row is a
          # deliberate act that shows up in the run summary.
          $allowed = @{
            '170' = 'window re-acquisition PropertyNotSupportedException, ~7% per launch (UIA code 30011, not an issue number)'          }
          $trx = Get-ChildItem build/e2e-native-results -Filter *.trx -Recurse | Select-Object -First 1
          if (-not $trx) { Write-Error 'no trx produced'; exit 1 }
          [xml]$x = Get-Content $trx.FullName
          $c = $x.TestRun.ResultSummary.Counters
          $results = @($x.TestRun.Results.UnitTestResult)
          $skipped = @($results | Where-Object { $_.outcome -ne 'Passed' -and $_.outcome -ne 'Failed' })
          Write-Host ("total={0} executed={1} passed={2} failed={3} notExecuted={4}" -f $c.total, $c.executed, $c.passed, $c.failed, $c.notExecuted)
          Write-Host ("allow-list entries: {0}" -f $allowed.Count)
          $unexplained = @()
          $accounted = @()
          foreach ($s in $skipped) {
            $msg = [string]$s.Output.ErrorInfo.Message
            $m = [regex]::Match($msg, 'XPE-SKIP-ALLOWED:(\d+)')
            if ($m.Success -and $allowed.ContainsKey($m.Groups[1].Value)) {
              $accounted += [pscustomobject]@{ name = $s.testName; issue = $m.Groups[1].Value }
              Write-Host ("SKIPPED (accounted, #{0}): {1} - {2}" -f $m.Groups[1].Value, $s.testName, $allowed[$m.Groups[1].Value])
            } else {
              $unexplained += $s
              Write-Host ("NOT RUN (unexplained): {0} [{1}] {2}" -f $s.testName, $s.outcome, $msg)
            }
          }
          # C: count it, every run, whether or not anything is red. A number with no
          # gate attached is still the only way a trend becomes visible - there is no
          # CI baseline for this defect yet, so no threshold is set.
          if ($env:GITHUB_STEP_SUMMARY) {
            "### Native E2E skips" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            ("- accounted: {0}" -f $accounted.Count) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            ("- unexplained: {0}" -f $unexplained.Count) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            foreach ($a in $accounted) {
              ("  - #{0} {1}" -f $a.issue, $a.name) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }
          # total-vs-executed still has to agree, but now it agrees WITH the accounted
          # skips rather than with zero - otherwise an accounted skip would trip the
          # counter check the token was meant to excuse.
          $gap = [int]$c.total - [int]$c.executed
          if ($unexplained.Count -gt 0) {
            Write-Error ('{0} E2E case(s) did not run in the Native job with no accounted reason - a generator/staging problem hidden as green' -f $unexplained.Count)
            exit 1
          }
          if ($gap -ne $accounted.Count) {
            Write-Error ('counter mismatch: total-executed={0} but {1} skip(s) carried an accounted token - a case vanished from the results without a UnitTestResult entry' -f $gap, $accounted.Count)
            exit 1
          }

      - name: Upload Native E2E results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-gui-e2e-native-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/e2e-native-results/

  clang-tidy:
    # QA-A-234 (#253): clang-tidy over modules/common and modules/preprocess with each module's .clang-tidy.
    # A baseline gate: a (check, file) pair with more findings than tools/ci/clang_tidy_baseline_<module>.txt
    # fails the job. If the runner image has no clang-tidy the script says so and fails -- that first run is how
    # we learn whether windows-2025 ships it.
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CMake (preprocess builds common too)
        shell: pwsh
        run: cmake --preset ci-preprocess

      - name: clang-tidy modules/common against its baseline
        shell: pwsh
        run: python tools/ci/check_clang_tidy.py common build/ci-preprocess tools/ci/clang_tidy_baseline_common.txt

      - name: clang-tidy modules/preprocess against its baseline
        shell: pwsh
        run: python tools/ci/check_clang_tidy.py preprocess build/ci-preprocess tools/ci/clang_tidy_baseline_preprocess.txt

  cppcheck:
    name: cppcheck (measurement only)
    # QA-A-234 / QA-A-234c (#253): MEASUREMENT ONLY. It never fails the pipeline (--error-exitcode=0 and no gate step);
    # it prints the finding count per module and uploads the XML. cppcheck is not installed on the lane machines, so
    # no count existed when this job was written.
    # Becoming a gate: the leader reads the FIRST CI result (the artifact `cppcheck-results`) and approves it as the
    # baseline; only then a gate step in the shape of tools/ci/check_clang_tidy.py (identity baseline, non-zero exit
    # fails, positive control) replaces the --error-exitcode=0 run and this name loses "(measurement only)". The leader
    # opens the follow-up issue for that switch (QA-A-234c); until it is done this job gates nothing.
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install cppcheck
        shell: pwsh
        run: |
          if (-not (Get-Command cppcheck -ErrorAction SilentlyContinue)) {
            choco install cppcheck -y --no-progress
            $env:Path += ';C:\Program Files\Cppcheck'
            Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Cppcheck'
          }
          & 'C:\Program Files\Cppcheck\cppcheck.exe' --version

      - name: Run cppcheck (measurement only)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/cppcheck | Out-Null
          foreach ($m in 'common', 'preprocess') {
            & 'C:\Program Files\Cppcheck\cppcheck.exe' --enable=warning,performance,portability --std=c++17 `
              --inline-suppr --suppress=missingIncludeSystem --error-exitcode=0 --xml `
              -I modules/common/include -I modules/preprocess/include -I modules/preprocess/src `
              "modules/$m/src" 2> "build/cppcheck/$m.xml"
            $n = (Select-String -Path "build/cppcheck/$m.xml" -Pattern '<error ' -AllMatches).Matches.Count
            Write-Host ("cppcheck modules/{0}: {1} finding(s)" -f $m, $n)
          }

      - name: Upload cppcheck results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: cppcheck-results
          retention-days: 14
          path: build/cppcheck/

  doxygen-headers:
    # QA-A-170: `Documentation Generation` caught a real header-doc regression
    # and stayed red for five runs because it triggers only on push to main --
    # after the merge -- and nothing reads its conclusion. The check itself was
    # fine; its placement was not. This job runs the identical command on the
    # lane branches and on every PR, so the lane sees it before the merge.
    #
    # It does NOT replace tools/docs/check_header_docs.py (#159). That script
    # reported "20 headers, 0 findings, EXIT=0" on the same broken tree: its
    # declaration regex matches only `XPE_API xpe_*`, so the four inline
    # `xpe::preprocess::internal` functions were invisible, and it models
    # neither missing @return nor comment-block adjacency. Widening it would
    # still miss both of those -- which is why the gate is doxygen itself.
    #
    # Steps are copied verbatim from docs-generate.yml rather than simplified:
    # a different invocation would produce a different verdict, and the point
    # is that this job and that workflow agree. The awesome-css clone is not
    # decoration -- HTML_EXTRA_STYLESHEET points into it, and a missing file
    # is a warning, which WARN_AS_ERROR=FAIL_ON_WARNINGS turns into a failure.
    name: Header docs (doxygen)
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Doxygen
        uses: ssciwr/doxygen-install@v2
        with:
          version: "1.12.0"

      - name: Clone doxygen-awesome-css
        run: |
          git clone --depth 1 https://github.com/jothepro/doxygen-awesome-css.git docs/help/doxygen/doxygen-awesome
        shell: bash

      - name: Create Doxygen output directory
        run: mkdir -p docs/help/generated/doxygen
        shell: bash

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile
        working-directory: docs/help/doxygen
        shell: bash

  coverage:
    # Dispatch-only and self-contained (own configure/build). Not gated on the
    # test jobs: a single flaky assertion there must not skip the coverage
    # measurement (#120, observed 2026-09-10 — EnduranceTest boundary failure
    # skipped both coverage presets). Test pass/fail stays the test jobs' gate.
    # QA-A-234 (#253): the 85% gate runs for every push to main (common + preprocess only, about 16 min, a job of its
    # own so it delays no other job); all three presets run on the weekly schedule and on manual dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # coverage       = common + preprocess (REQ-P0-006 scope)
        # coverage-post  = common + gsvg/enhance_basic/enhance_advanced/display (ci-post scope)
        # coverage-dicom = common + dicom; the only preset that needs vcpkg
        #                  (DCMTK + OpenJPEG have no FetchContent fallback, #124)
        preset: ${{ fromJSON(github.event_name == 'push' && '["coverage"]' || '["coverage","coverage-post","coverage-dicom"]') }}
    name: coverage (${{ matrix.preset }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Install OpenCppCoverage
        shell: pwsh
        run: choco install opencppcoverage -y --no-progress

      # vcpkg is used ONLY by coverage-dicom. The runner image ships vcpkg at
      # $env:VCPKG_INSTALLATION_ROOT; the preset reads $env{VCPKG_ROOT}. DCMTK is
      # a long build, so its binary packages are cached across dispatches keyed
      # by the dicom manifest.
      - name: Point VCPKG_ROOT at the runner vcpkg (dicom only)
        if: matrix.preset == 'coverage-dicom'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path $root)) { $root = 'C:\vcpkg' }
          if (-not (Test-Path (Join-Path $root 'scripts\buildsystems\vcpkg.cmake'))) {
            Write-Error "vcpkg toolchain not found under $root"; exit 1
          }
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-bincache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "VCPKG_DISABLE_METRICS=1" >> $env:GITHUB_ENV
          & (Join-Path $root 'vcpkg.exe') --version

      # restore/save are split on purpose: actions/cache's combined form saves
      # only when the job succeeds, and coverage-dicom fails on the threshold
      # today, so DCMTK (18-20 min) was rebuilt on every dispatch (runs
      # 34444576614, 34447732961: "Cache not found" twice with the same key).
      - name: Restore vcpkg binary cache (dicom only)
        if: matrix.preset == 'coverage-dicom'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-bincache-${{ runner.os }}-dicom-${{ hashFiles('third_party/dicom/vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-dicom-

      - name: Configure coverage build
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}

      - name: Build coverage configuration
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      # REQ-P0-006: the `coverage` target runs the whole ctest suite under
      # OpenCppCoverage and writes build/coverage/coverage/coverage.xml;
      # `coverage_check` fails the job when line-rate < 0.85 (#113).
      # dicom tests load dcmtk/openjpeg DLLs; vcpkg applocal usually copies them
      # next to the test binaries, but the manifest-mode install dir is put on
      # PATH as well so a missing copy fails loudly in ctest, not as 0xc0000135.
      - name: Put vcpkg runtime DLLs on PATH (dicom only)
        if: matrix.preset == 'coverage-dicom'
        shell: pwsh
        run: |
          $bin = Join-Path (Get-Location) 'build\${{ matrix.preset }}\vcpkg_installed\x64-windows\bin'
          $dbg = Join-Path (Get-Location) 'build\${{ matrix.preset }}\vcpkg_installed\x64-windows\debug\bin'
          "$dbg;$bin;$env:PATH" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # One step, not two: coverage_check DEPENDS on coverage, so a separate
      # `--target coverage` step made the whole ctest run under OpenCppCoverage
      # execute twice (observed 2026-09-10 in run 34444576614 — every skip/pass
      # line appeared doubled). The report from the single run is what the
      # threshold is checked against.
      - name: Run coverage and enforce threshold (85%)
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --target coverage_check

      - name: Save vcpkg binary cache (dicom only)
        if: always() && matrix.preset == 'coverage-dicom' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-bincache-${{ runner.os }}-dicom-${{ hashFiles('third_party/dicom/vcpkg.json') }}

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.preset }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/${{ matrix.preset }}/coverage/
