name: XPE CI Pipeline

on:
  push:
    branches: [ main, dev/preprocess, dev/postprocess, dev/gui ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xpe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-lane:
    runs-on: windows-2025
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.detect.outputs.lane }}
      is_main: ${{ steps.detect.outputs.is_main }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Lane
        id: detect
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $isMain = "false"
          $lane = "unknown"

          if ($branch -eq "main") {
            $isMain = "true"
            $lane = "main"
          } elseif ($branch -eq "dev/preprocess") {
            $lane = "preprocess"
          } elseif ($branch -eq "dev/postprocess") {
            $lane = "postprocess"
          } elseif ($branch -eq "dev/gui") {
            $lane = "gui"
          }

          Write-Output "lane=$lane" >> $env:GITHUB_OUTPUT
          Write-Output "is_main=$isMain" >> $env:GITHUB_OUTPUT
          Write-Output "Detected: lane=$lane, is_main=$isMain"

  common-build:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tracked text files
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Test-TrackedTextFiles.ps1

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset ci-common

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci-common --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build/ci-common --build-config RelWithDebInfo --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/ci-common/Testing/

      - name: Upload common binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-common-binaries
          if-no-files-found: warn
          retention-days: 14
          path: build/ci-common/bin/

  preprocess-tests:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CMake (preprocess)
        shell: pwsh
        run: cmake --preset ci-preprocess

      - name: Build preprocess
        shell: pwsh
        run: cmake --build --preset ci-preprocess --parallel

      - name: Run preprocess tests
        shell: pwsh
        run: ctest --test-dir build/ci-preprocess --build-config RelWithDebInfo --output-on-failure

      - name: Upload preprocess test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-preprocess-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/ci-preprocess/Testing/

      - name: Upload preprocess binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-preprocess-binaries
          if-no-files-found: warn
          retention-days: 14
          path: build/ci-preprocess/bin/

  dotnet-tests:
    needs: [detect-lane, common-build, preprocess-tests]
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane == 'gui'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Two native axes gate this suite, and neither uses SkipHelper.cs
      # (that helper has zero callers — the guards are inline early returns):
      #   1. IsAvailable  -> xpe_common.dll      (51 of 90 cases)
      #   2. DllPath      -> xpe_preprocess.dll  (9 of 90 cases, P1AReady/)
      # Both probe build/ci-common/bin, so staging the two DLLs there covers
      # the csproj CopyXpeDllsForTests target and TryFindDll at once. Without
      # them the suite reports 90/90 pass with 0 skipped while verifying nothing.
      - name: Download common binaries
        uses: actions/download-artifact@v6
        with:
          name: xpe-ci-common-binaries
          path: build/ci-common/bin/

      - name: Download preprocess binaries
        uses: actions/download-artifact@v6
        with:
          name: xpe-ci-preprocess-binaries
          path: build/ci-common/bin/

      - name: Verify native binaries present
        shell: pwsh
        run: |
          $missing = @()
          foreach ($n in @('xpe_common.dll', 'xpe_preprocess.dll')) {
            if (-not (Test-Path "build/ci-common/bin/$n")) { $missing += $n }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Native DLLs missing from build/ci-common/bin: $($missing -join ', ') - the suite would report 90/90 pass with 0 skipped while verifying nothing"
            exit 1
          }
          Get-ChildItem build/ci-common/bin/ -Filter *.dll | Select-Object Name, Length

      - name: Run C# integration tests
        shell: pwsh
        run: >
          dotnet test clients/ImageProcTest.IntegrationTests/ImageProcTest.IntegrationTests.csproj
          -c Debug
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory build/dotnet-test-results

      - name: Upload C# test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-dotnet-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/dotnet-test-results/

  coverage:
    if: github.event_name == 'workflow_dispatch'
    needs: [common-build, preprocess-tests]
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Install OpenCppCoverage
        shell: pwsh
        run: choco install opencppcoverage -y --no-progress

      - name: Configure coverage build
        shell: pwsh
        run: cmake --preset coverage

      - name: Build coverage target
        shell: pwsh
        run: cmake --build --preset coverage --parallel

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v6
        with:
          name: coverage-build-artifacts
          if-no-files-found: ignore
          retention-days: 14
          path: build/coverage/
