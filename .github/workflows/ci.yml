name: XPE CI Pipeline

on:
  push:
    branches: [ main, dev/preprocess, dev/postprocess, dev/gui ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xpe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-lane:
    runs-on: windows-2025
    timeout-minutes: 5
    outputs:
      lane: ${{ steps.detect.outputs.lane }}
      is_main: ${{ steps.detect.outputs.is_main }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect Lane
        id: detect
        shell: pwsh
        run: |
          $branch = "${{ github.ref_name }}"
          $isMain = "false"
          $lane = "unknown"

          if ($branch -eq "main") {
            $isMain = "true"
            $lane = "main"
          } elseif ($branch -eq "dev/preprocess") {
            $lane = "preprocess"
          } elseif ($branch -eq "dev/postprocess") {
            $lane = "postprocess"
          } elseif ($branch -eq "dev/gui") {
            $lane = "gui"
          }

          Write-Output "lane=$lane" >> $env:GITHUB_OUTPUT
          Write-Output "is_main=$isMain" >> $env:GITHUB_OUTPUT
          Write-Output "Detected: lane=$lane, is_main=$isMain"

  common-build:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate tracked text files
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Test-TrackedTextFiles.ps1

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset ci-common

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci-common --parallel

      - name: Run tests
        shell: pwsh
        run: ctest --test-dir build/ci-common --build-config RelWithDebInfo --output-on-failure

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/ci-common/Testing/

      - name: Upload common binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-common-binaries
          if-no-files-found: warn
          retention-days: 14
          path: build/ci-common/bin/

  preprocess-tests:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CMake (preprocess)
        shell: pwsh
        run: cmake --preset ci-preprocess

      - name: Build preprocess
        shell: pwsh
        run: cmake --build --preset ci-preprocess --parallel

      - name: Run preprocess tests
        shell: pwsh
        run: ctest --test-dir build/ci-preprocess --build-config RelWithDebInfo --output-on-failure

      - name: Upload preprocess test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-preprocess-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/ci-preprocess/Testing/

      - name: Upload preprocess binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-preprocess-binaries
          if-no-files-found: warn
          retention-days: 14
          path: build/ci-preprocess/bin/

  # Post-processing lane build (ci-post preset: common + gsvg/enhance_basic/
  # enhance_advanced/display; dicom/ai off). Until 2026-09-10 no push-triggered
  # job built these DLLs at all, so Lane B code had no CI gate and
  # xpe_enhance_basic.dll was never staged for the C# suite (GUI-C-10, #123).
  post-build:
    needs: detect-lane
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane != 'unknown'
    runs-on: windows-2025
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CMake
        shell: pwsh
        run: cmake --preset ci-post

      - name: Build
        shell: pwsh
        run: cmake --build --preset ci-post --parallel

      # Wall-clock budget cases are excluded here for the same reason as in
      # cmake/XpeCoverage.cmake (XPE_COVERAGE_EXCLUDE_TESTS): on a shared runner
      # they measure the machine, not the code. First run (34417874089) failed
      # exactly 3 such cases by 1-16 ms. Timing regressions are the benchmark
      # workflow's gate. Keep this regex in sync with XpeCoverage.cmake.
      - name: Run tests (timing-budget cases excluded)
        shell: pwsh
        run: ctest --test-dir build/ci-post --build-config RelWithDebInfo --output-on-failure -E "Performance|Within[0-9]+ms|PerformanceBudget|LargeImagePerformance"

      - name: Upload post test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-post-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/ci-post/Testing/

      - name: Upload post binaries
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-ci-post-binaries
          if-no-files-found: warn
          retention-days: 14
          path: build/ci-post/bin/

  dotnet-tests:
    needs: [detect-lane, common-build, preprocess-tests, post-build]
    if: needs.detect-lane.outputs.is_main == 'true' || needs.detect-lane.outputs.lane == 'gui'
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      # Two native axes gate this suite, and neither uses SkipHelper.cs
      # (that helper has zero callers — the guards are inline early returns):
      #   1. IsAvailable  -> xpe_common.dll      (51 of 90 cases)
      #   2. DllPath      -> xpe_preprocess.dll  (9 of 90 cases, P1AReady/)
      # Both probe build/ci-common/bin, so staging the two DLLs there covers
      # the csproj CopyXpeDllsForTests target and TryFindDll at once. Without
      # them the suite reports 90/90 pass with 0 skipped while verifying nothing.
      - name: Download common binaries
        uses: actions/download-artifact@v6
        with:
          name: xpe-ci-common-binaries
          path: build/ci-common/bin/

      - name: Download preprocess binaries
        uses: actions/download-artifact@v6
        with:
          name: xpe-ci-preprocess-binaries
          path: build/ci-common/bin/

      # enhance_basic is exercised by DataSizeContractTests (GUI-C-10, #123);
      # without this download those cases skip silently.
      - name: Download post binaries
        uses: actions/download-artifact@v6
        with:
          name: xpe-ci-post-binaries
          path: build/ci-common/bin/

      - name: Verify native binaries present
        shell: pwsh
        run: |
          $missing = @()
          foreach ($n in @('xpe_common.dll', 'xpe_preprocess.dll', 'xpe_enhance_basic.dll')) {
            if (-not (Test-Path "build/ci-common/bin/$n")) { $missing += $n }
          }
          if ($missing.Count -gt 0) {
            Write-Error "Native DLLs missing from build/ci-common/bin: $($missing -join ', ') - the suite would report 90/90 pass with 0 skipped while verifying nothing"
            exit 1
          }
          Get-ChildItem build/ci-common/bin/ -Filter *.dll | Select-Object Name, Length

      - name: Run C# integration tests
        shell: pwsh
        run: >
          dotnet test clients/ImageProcTest.IntegrationTests/ImageProcTest.IntegrationTests.csproj
          -c Debug
          --logger "trx;LogFileName=integration-tests.trx"
          --results-directory build/dotnet-test-results

      - name: Upload C# test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: xpe-dotnet-test-results
          if-no-files-found: ignore
          retention-days: 14
          path: build/dotnet-test-results/

  coverage:
    # Dispatch-only and self-contained (own configure/build). Not gated on the
    # test jobs: a single flaky assertion there must not skip the coverage
    # measurement (#120, observed 2026-09-10 — EnduranceTest boundary failure
    # skipped both coverage presets). Test pass/fail stays the test jobs' gate.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # coverage       = common + preprocess (REQ-P0-006 scope)
        # coverage-post  = common + gsvg/enhance_basic/enhance_advanced/display (ci-post scope)
        # coverage-dicom = common + dicom; the only preset that needs vcpkg
        #                  (DCMTK + OpenJPEG have no FetchContent fallback, #124)
        preset: [coverage, coverage-post, coverage-dicom]
    name: coverage (${{ matrix.preset }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Install OpenCppCoverage
        shell: pwsh
        run: choco install opencppcoverage -y --no-progress

      # vcpkg is used ONLY by coverage-dicom. The runner image ships vcpkg at
      # $env:VCPKG_INSTALLATION_ROOT; the preset reads $env{VCPKG_ROOT}. DCMTK is
      # a long build, so its binary packages are cached across dispatches keyed
      # by the dicom manifest.
      - name: Point VCPKG_ROOT at the runner vcpkg (dicom only)
        if: matrix.preset == 'coverage-dicom'
        shell: pwsh
        run: |
          $root = $env:VCPKG_INSTALLATION_ROOT
          if (-not $root -or -not (Test-Path $root)) { $root = 'C:\vcpkg' }
          if (-not (Test-Path (Join-Path $root 'scripts\buildsystems\vcpkg.cmake'))) {
            Write-Error "vcpkg toolchain not found under $root"; exit 1
          }
          $cache = Join-Path $env:RUNNER_TEMP 'vcpkg-bincache'
          New-Item -ItemType Directory -Force -Path $cache | Out-Null
          "VCPKG_ROOT=$root" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=$cache" >> $env:GITHUB_ENV
          "VCPKG_DISABLE_METRICS=1" >> $env:GITHUB_ENV
          & (Join-Path $root 'vcpkg.exe') --version

      - name: Restore vcpkg binary cache (dicom only)
        if: matrix.preset == 'coverage-dicom'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/vcpkg-bincache
          key: vcpkg-bincache-${{ runner.os }}-dicom-${{ hashFiles('third_party/dicom/vcpkg.json') }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-dicom-

      - name: Configure coverage build
        shell: pwsh
        run: cmake --preset ${{ matrix.preset }}

      - name: Build coverage configuration
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      # REQ-P0-006: the `coverage` target runs the whole ctest suite under
      # OpenCppCoverage and writes build/coverage/coverage/coverage.xml;
      # `coverage_check` fails the job when line-rate < 0.85 (#113).
      # dicom tests load dcmtk/openjpeg DLLs; vcpkg applocal usually copies them
      # next to the test binaries, but the manifest-mode install dir is put on
      # PATH as well so a missing copy fails loudly in ctest, not as 0xc0000135.
      - name: Put vcpkg runtime DLLs on PATH (dicom only)
        if: matrix.preset == 'coverage-dicom'
        shell: pwsh
        run: |
          $bin = Join-Path (Get-Location) 'build\${{ matrix.preset }}\vcpkg_installed\x64-windows\bin'
          $dbg = Join-Path (Get-Location) 'build\${{ matrix.preset }}\vcpkg_installed\x64-windows\debug\bin'
          "$dbg;$bin;$env:PATH" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Run coverage (OpenCppCoverage over ctest)
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --target coverage

      - name: Enforce coverage threshold (85%)
        shell: pwsh
        run: cmake --build --preset ${{ matrix.preset }} --target coverage_check

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.preset }}
          if-no-files-found: ignore
          retention-days: 14
          path: build/${{ matrix.preset }}/coverage/
