name: Repository Guard

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-repository:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure and backlog sync
        shell: pwsh
        run: ./tools/ci/Validate-Repo.ps1

      - name: Check whitespace and patch cleanliness
        shell: pwsh
        run: git diff --check
