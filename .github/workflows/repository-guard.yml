name: Repository Guard

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: '20 20 * * 0'

permissions:
  contents: read

concurrency:
  group: repository-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-repository:
    runs-on: windows-2025
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate repository structure and backlog sync
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Validate-Repo.ps1

      - name: Validate markdown links
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Test-MarkdownLinks.ps1

      - name: Validate tracked text files
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Test-TrackedTextFiles.ps1
