name: Delivery Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-bundle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-docs-and-plans:
    runs-on: windows-2025
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate repository
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Validate-Repo.ps1

      - name: Validate markdown links
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Test-MarkdownLinks.ps1

      - name: Create delivery bundle
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\New-ReleaseBundle.ps1 -OutDir out/release-bundle

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v6
        with:
          name: xpe-delivery-bundle
          if-no-files-found: error
          retention-days: 30
          path: out/release-bundle/**
