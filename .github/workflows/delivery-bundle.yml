name: Delivery Bundle

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bundle-docs-and-plans:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository
        shell: pwsh
        run: ./tools/ci/Validate-Repo.ps1

      - name: Create delivery bundle
        shell: pwsh
        run: ./tools/ci/New-ReleaseBundle.ps1 -OutDir out/release-bundle

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpe-delivery-bundle
          path: out/release-bundle/**
