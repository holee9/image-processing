name: XPE Benchmark Regression (BP-06~09 + 3000ms budget)

# BP-06~09 freezes Post-B benchmark gates; the 3072x3072 3000ms budget (#56) runs here too.
# BP-10 (degraded-mode cross-lane) moved to ci.yml dotnet-tests: DegradedModeReadinessTests /
# ModuleReadinessReportingTests assert app-side readiness with the DLL absent (GUI-C-14~18, #128).
# The former native placeholder + Test-DegradedMode.ps1 only proved the harness deleted a file.
# Run manually or after main merges to verify regression baseline.

on:
  workflow_dispatch:
    inputs:
      freeze_baseline:
        description: 'Freeze current results as new baseline (true/false)'
        required: false
        default: 'false'
  push:
    branches: [ main ]
    paths:
      - 'modules/**'
      - 'clients/**'
      - 'benchmark/**'
      - 'tools/ci/Test-DegradedMode.ps1'
      - '.github/workflows/benchmark-regression.yml'

permissions:
  contents: read

concurrency:
  group: xpe-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-full-pipeline:
    runs-on: windows-2025
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CMake (Post-B benchmark)
        shell: pwsh
        run: cmake --preset ci-post

      - name: Build Post-B modules
        shell: pwsh
        run: cmake --build --preset ci-post --parallel

      # -V, not only --output-on-failure: measurement-only tests (#179) print their numbers and
      # assert no time, so they pass - and --output-on-failure drops the output of passing tests
      # (QA-B-84 counted 0 ADV061 lines that way, 1 with -V). The measurement lines are copied to
      # the step summary so they can be read without opening the full log.
      - name: Run BP-06~09 benchmark freeze GTests
        shell: pwsh
        run: |
          $pattern = 'FullPipelineE2E\.PostProcess_3072x3072_Within3000ms|BenchmarkFreeze|CollimationDetectTest\.BenchmarkFreeze_BP07_CollimationDetectionBaseline|ExposureIndex\.BenchmarkFreeze_BP0[89]_(EI|DI)CalcTimeBaseline'
          $log = Join-Path $env:RUNNER_TEMP 'benchmark-ctest.log'
          ctest --test-dir build/ci-post --build-config RelWithDebInfo --output-on-failure -V -R $pattern 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $lines = Select-String -Path $log -Pattern 'ADV061 fractional|PERFMEASURE ' | ForEach-Object { $_.Line.Trim() }
          "### Measurement-only benchmarks (#179)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
          if ($lines) { $lines | ForEach-Object { "- ``$_``" } | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          else { "- no ADV061 or PERFMEASURE line in this run (tests not present on this commit, or they did not print)" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY }
          exit $code

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: xpe-pipeline-binaries
          retention-days: 1
          path: |
            build/ci-post/bin/*.dll
            build/ci-post/bin/*.exe
