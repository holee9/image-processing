name: Windows Common Build

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - modules/common/**
      - tests/**
      - third_party/vcpkg.json
      - third_party/common/**
      - tools/ci/**
      - .github/workflows/windows-common-build.yml
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - modules/common/**
      - tests/**
      - third_party/vcpkg.json
      - third_party/common/**
      - tools/ci/**
      - .github/workflows/windows-common-build.yml
  schedule:
    - cron: '50 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-common-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-common:
    runs-on: windows-2025
    timeout-minutes: 45

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate repository before build
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Validate-Repo.ps1

      - name: Validate markdown links
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Test-MarkdownLinks.ps1

      - name: Validate tracked text files
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Test-TrackedTextFiles.ps1

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Cache vcpkg downloads and installed packages
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.VCPKG_ROOT }}\downloads
            ${{ env.VCPKG_ROOT }}\installed
            ${{ env.VCPKG_ROOT }}\packages
          key: vcpkg-common-x64-windows-${{ runner.os }}-${{ hashFiles('third_party/common/vcpkg.json') }}

      - name: Install pinned vcpkg
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Install-PinnedVcpkg.ps1 -ManifestPath third_party/common/vcpkg.json

      - name: Install dependencies from manifest
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-manifest-root=third_party/common --triplet x64-windows

      - name: Configure common build
        shell: pwsh
        run: |
          cmake --preset ci-common

      - name: Build common target and smoke tests
        shell: pwsh
        run: |
          cmake --build --preset ci-common --parallel

      - name: Run ctest smoke validation
        shell: pwsh
        run: |
          ctest --test-dir build/ci-common --build-config RelWithDebInfo --output-on-failure

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: xpe-common-windows-build
          if-no-files-found: error
          retention-days: 14
          path: |
            build/ci-common/bin/**
            build/ci-common/lib/**
