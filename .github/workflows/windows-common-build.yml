name: Windows Common Build

on:
  pull_request:
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - modules/common/**
      - third_party/vcpkg.json
      - tools/ci/**
      - .github/workflows/windows-common-build.yml
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - modules/common/**
      - third_party/vcpkg.json
      - tools/ci/**
      - .github/workflows/windows-common-build.yml
  workflow_dispatch:

jobs:
  build-common:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: ${{ github.workspace }}\vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository before build
        shell: pwsh
        run: ./tools/ci/Validate-Repo.ps1

      - name: Cache vcpkg downloads and installed packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}\downloads
            ${{ env.VCPKG_ROOT }}\installed
            ${{ env.VCPKG_ROOT }}\packages
          key: vcpkg-x64-windows-${{ runner.os }}-${{ hashFiles('third_party/vcpkg.json') }}

      - name: Clone vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path $env:VCPKG_ROOT)) {
            git clone https://github.com/microsoft/vcpkg $env:VCPKG_ROOT
          }

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics

      - name: Install dependencies from manifest
        shell: pwsh
        run: |
          & "$env:VCPKG_ROOT\vcpkg.exe" install --x-manifest-root=third_party --triplet x64-windows

      - name: Configure common build
        shell: pwsh
        run: |
          cmake -S . -B build/ci-common -G Ninja `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_MANIFEST_DIR="$pwd\third_party" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DBUILD_TESTS=OFF `
            -DBUILD_GSVG=OFF

      - name: Build common target
        shell: pwsh
        run: |
          cmake --build build/ci-common --parallel

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: xpe-common-windows-build
          path: |
            build/ci-common/bin/**
            build/ci-common/lib/**
