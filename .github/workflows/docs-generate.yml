name: Documentation Generation

on:
  push:
    branches:
      - main
      - dev/integration
    paths:
      - 'modules/*/include/**/*.h'
      - 'docs/help/**'
      - 'gui/**/*.cs'
      - 'gui/**/*.csproj'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  doxygen-native:
    name: Doxygen Native API Reference
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Doxygen
        uses: ssciwr/doxygen-install@v2
        with:
          version: "1.12.0"

      - name: Clone doxygen-awesome-css
        run: |
          git clone https://github.com/jothepro/doxygen-awesome-css.git docs/help/doxygen/doxygen-awesome
        shell: bash

      - name: Create Doxygen output directory
        run: mkdir -p docs/help/generated/doxygen
        shell: bash

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile
        working-directory: docs/help/doxygen
        shell: bash

      - name: Upload Doxygen artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-reference-native
          path: docs/help/generated/doxygen/html/
          retention-days: 30

  docfx-managed:
    name: DocFX Managed API + Conceptual
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Install DocFX
        run: dotnet tool install -g docfx

      - name: Build DocFX documentation
        run: docfx docs/help/docfx/docfx.json
        shell: bash

      # GUI-C-169 found this job green with nothing in it: 0 API pages and a
      # 52-byte xrefmap.yml. docfx's metadata src pointed at `../../gui`, which
      # from docs/help/docfx/ resolves to docs/gui -- a directory that does not
      # exist. The sibling Doxyfile at the same depth correctly uses `../../../`;
      # only this file was short by one level. docfx finds no projects, emits
      # nothing, and exits 0, so the job passed for as long as the path was wrong.
      #
      # The path is fixed. This step is the part that makes the fix hold: an
      # empty generation is now a failure rather than a pass. The threshold is
      # deliberately 1, not a count that tracks the project list -- this asserts
      # "something was generated", which is the property that was silently false.
      # Two directories, because docfx writes to two and they are configured
      # relative to different roots:
      #   metadata.dest = "api"               -> docs/help/docfx/api/   (.yml)
      #   build.output  = "../generated/docfx" -> docs/help/generated/docfx/ (.html)
      # The first says metadata ran; the second says it reached the artifact
      # that gets uploaded and packaged. GUI-C-169 inspected the second and
      # found it empty, so that is the one the original finding is about.
      #
      # The first version of this step checked for .yml under the OUTPUT dir --
      # wrong root and wrong extension, so it failed on a run where generation
      # had actually started working. The listing below exists because of that:
      # when this guard fails it must say what it did see, or the next run only
      # tells me "still wrong" again.
      - name: Assert DocFX produced managed API pages
        shell: pwsh
        run: |
          $meta = 'docs/help/docfx/api'
          $site = 'docs/help/generated/docfx/api'
          $metaPages = @()
          $sitePages = @()
          if (Test-Path -LiteralPath $meta) {
            $metaPages = @(Get-ChildItem -LiteralPath $meta -Filter *.yml -Recurse |
                           Where-Object { $_.Name -ne 'toc.yml' })
          }
          if (Test-Path -LiteralPath $site) {
            $sitePages = @(Get-ChildItem -LiteralPath $site -Filter *.html -Recurse |
                           Where-Object { $_.Name -ne 'toc.html' })
          }
          Write-Host ("metadata .yml : {0}" -f $metaPages.Count)
          Write-Host ("rendered .html: {0}" -f $sitePages.Count)
          if ($metaPages.Count -ge 1 -and $sitePages.Count -ge 1) { exit 0 }

          Write-Host '--- what is actually on disk ---'
          foreach ($d in @('docs/help/docfx', 'docs/help/generated/docfx')) {
            Write-Host ("[{0}]" -f $d)
            if (Test-Path -LiteralPath $d) {
              Get-ChildItem -LiteralPath $d -Recurse -File |
                Select-Object -First 40 |
                ForEach-Object { Write-Host ("   {0}  {1} B" -f $_.FullName, $_.Length) }
            } else { Write-Host '   (absent)' }
          }
          Write-Error 'docfx produced no managed API pages - a green job with no content'
          exit 1

      - name: Upload DocFX artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-reference-managed
          path: docs/help/generated/docfx/
          retention-days: 30

  docs-bundle-release:
    name: Package Help Bundle (Release only)
    runs-on: windows-latest
    needs: [doxygen-native, docfx-managed]
    if: github.event_name == 'release'
    steps:
      - name: Download Doxygen artifact
        uses: actions/download-artifact@v8
        with:
          name: api-reference-native
          path: help-bundle/doxygen/

      - name: Download DocFX artifact
        uses: actions/download-artifact@v8
        with:
          name: api-reference-managed
          path: help-bundle/docfx/

      - name: Create help bundle zip
        run: Compress-Archive -Path help-bundle/* -DestinationPath help-bundle-${{ github.ref_name }}.zip
        shell: pwsh

      - name: Upload help bundle to release
        uses: softprops/action-gh-release@v3
        with:
          files: help-bundle-${{ github.ref_name }}.zip
