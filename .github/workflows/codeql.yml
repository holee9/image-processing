name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - modules/**
      - tests/**
      - third_party/**
      - .github/workflows/codeql.yml
  pull_request:
    paths:
      - CMakeLists.txt
      - CMakePresets.json
      - cmake/**
      - modules/**
      - tests/**
      - third_party/**
      - .github/workflows/codeql.yml
  schedule:
    - cron: '10 21 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: windows-2025
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language:
          - c-cpp

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Validate repository before analysis
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Validate-Repo.ps1

      - name: Validate markdown links
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Test-MarkdownLinks.ps1

      - name: Validate tracked text files
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Test-TrackedTextFiles.ps1

      - name: Ensure Ninja is available
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress
          }
          ninja --version

      - name: Configure MSVC developer environment
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File .\tools\ci\Use-MsvcDevShell.ps1 -PersistForGitHubActions

      - name: Configure CodeQL build
        shell: pwsh
        run: |
          cmake --preset ci-common

      - name: Build for CodeQL extraction
        shell: pwsh
        run: |
          cmake --build --preset ci-common --parallel

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
